<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1920 1080"><title>세 분류기의 초기 데이터 선정</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F5F7FB"/><rect x="70" y="43" width="271" height="43" rx="21" fill="#EAF2FF"/><text x="205.5" y="73" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#387EFA" text-anchor="middle">01  DATA SELECTION</text><text x="70" y="157" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="48" font-weight="750" fill="#172D50" text-anchor="start">세 분류기의 초기 데이터 선정</text><text x="70" y="204" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" font-weight="400" fill="#657894" text-anchor="start">촬영 대상에 따라 분류기를 나누고, 원천 제공량과 실제 첫 사용량을 구분</text><line x1="70" y1="231" x2="1850" y2="231" stroke="#D9E3F0" stroke-width="2"/><text x="70" y="272" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#657894" text-anchor="start">분류 대상</text><text x="295" y="272" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#657894" text-anchor="start">원천 데이터와 제공 규모</text><text x="850" y="272" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#657894" text-anchor="start">선정 기준</text><text x="1410" y="272" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#657894" text-anchor="start">첫 분할에 사용한 원본</text><rect x="70" y="296" width="190" height="202" rx="28" fill="#387EFA"/><text x="165" y="365" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="32" font-weight="750" fill="white" text-anchor="middle">SKIN</text><text x="165" y="411" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="400" fill="white" text-anchor="middle">확대 피부 병변</text><text x="165" y="447" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-w