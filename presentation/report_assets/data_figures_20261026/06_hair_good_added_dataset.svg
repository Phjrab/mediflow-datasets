="21" fill="#E5F7F4"/><text x="223.5" y="849" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#10B5A5" text-anchor="middle">탈모</text><rect x="367" y="819" width="247" height="43" rx="21" fill="#E5F7F4"/><text x="490.5" y="849" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#10B5A5" text-anchor="middle">피지과다</text><rect x="634" y="819" width="247" height="43" rx="21" fill="#E5F7F4"/><text x="757.5" y="849" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#10B5A5" text-anchor="middle">양호</text><text x="100" y="926" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="500" fill="#172D50" text-anchor="start">양호: 원천 6개 증상 값이 모두 0이라는 사용자 확인</text><rect x="950" y="675" width="900" height="290" rx="26" fill="white" stroke="#D9E3F0" stroke-width="2"/><text x="980" y="722" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="27" font-weight="750" fill="#10B5A5" text-anchor="start">증강 조건의 학습 데이터</text><text x="980" y="777" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="41" font-weight="800" fill="#10B5A5" text-anchor="start">Train 17,615장</text><text x="980" y="824" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="29" font-weight="700" fill="#172D50" text-anchor="start">원본 10,460 + 생성 7,155</text><text x="980" y="875" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="400" fill="#657894" text-anchor="start">양호 Train 428장에서 2,140장 생성, 합계 2,568장</text><text x="980" y="913" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="23" font-weight="400" fill="#657894" text-anchor="start">기존 5종에서 생성 5,015장. Validation·Test는 원본 유지</text><text x="70" y="1016" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" font-weight="400" fill="#657894" text-anchor="start">양호의 파일별 원천 JSON 재확인과 기존 5종을 포함한 사람·세션 독립성 