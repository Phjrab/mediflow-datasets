<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 1920 1080"><title>초기 분류 클래스와 선정 범위</title><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F5F7FB"/><rect x="70" y="43" width="235" height="43" rx="21" fill="#EAF2FF"/><text x="187.5" y="73" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="700" fill="#387EFA" text-anchor="middle">02  CLASS SCOPE</text><text x="70" y="157" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="48" font-weight="750" fill="#172D50" text-anchor="start">초기 분류 클래스와 선정 범위</text><text x="70" y="204" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="26" font-weight="400" fill="#657894" text-anchor="start">클래스는 모델이 구분하도록 정한 범주이며, 아래 순서는 저장된 모델의 출력 순서</text><line x1="70" y1="231" x2="1850" y2="231" stroke="#D9E3F0" stroke-width="2"/><rect x="70" y="274" width="560" height="680" rx="28" fill="white" stroke="#D9E3F0" stroke-width="2"/><rect x="70" y="274" width="560" height="8" rx="4" fill="#387EFA"/><text x="100" y="331" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="30" font-weight="800" fill="#387EFA" text-anchor="start">SKIN</text><text x="100" y="377" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="29" font-weight="700" fill="#172D50" text-anchor="start">확대 피부 병변 10종</text><rect x="100" y="410" width="245" height="43" rx="21" fill="#EAF2FF"/><text x="222.5" y="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#387EFA" text-anchor="middle">광선각화증</text><rect x="355" y="410" width="245" height="43" rx="21" fill="#EAF2FF"/><text x="477.5" y="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#387EFA" text-anchor="middle">기저세포암</text><rect x="100" y="469" width="245" height="43" rx="21" fill="#EAF2FF"/><text x="222.5" y="499" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#387EFA" text-anchor="middle">보웬병</text><rect x="355" y="469" width="245" height="43" rx="21" fill="#EAF2FF"/><text x="477.5" y="499" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#387EFA" text-anchor="middle">사마귀</text><rect x="100" y="528" width="245" height="43" rx="21" fill="#EAF2FF"/><text x="222.5" y="558" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#387EFA" text-anchor="middle">지루각화증</text><rect x="355" y="528" width="245" height="43" rx="21" fill="#EAF2FF"/><text x="477.5" y="558" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#387EFA" text-anchor="middle">편평세포암</text><rect x="100" y="587" width="245" height="43" rx="21" fill="#EAF2FF"/><text x="222.5" y="617" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#387EFA" text-anchor="middle">표피낭종</text><rect x="355" y="587" width="245" height="43" rx="21" fill="#EAF2FF"/><text x="477.5" y="617" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#387EFA" text-anchor="middle">피부섬유종</text><rect x="100" y="646" width="245" height="43" rx="21" fill="#EAF2FF"/><text x="222.5" y="676" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#387EFA" text-anchor="middle">혈관종</text><rect x="355" y="646" width="245" height="43" rx="21" fill="#EAF2FF"/><text x="477.5" y="676" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#387EFA" text-anchor="middle">흑색점</text><line x1="100" y1="716" x2="600" y2="716" stroke="#D9E3F0" stroke-width="2"/><text x="100" y="756" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#172D50" text-anchor="start">원천 15종 중 아래 5종 미사용</text><text x="100" y="790" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#172D50" text-anchor="start">악성흑색종, 멜라닌세포모반,</text><text x="100" y="824" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#172D50" text-anchor="start">피지샘증식증, 화농육아종, 비립종</text><text x="100" y="937" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="400" fill="#657894" text-anchor="start">클래스별 제외 판정표는 미보관</text><rect x="680" y="274" width="560" height="680" rx="28" fill="white" stroke="#D9E3F0" stroke-width="2"/><rect x="680" y="274" width="560" height="8" rx="4" fill="#8A5BEF"/><text x="710" y="331" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="30" font-weight="800" fill="#8A5BEF" text-anchor="start">WEB SKIN</text><text x="710" y="377" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="29" font-weight="700" fill="#172D50" text-anchor="start">얼굴 정면 피부 5종</text><rect x="710" y="410" width="245" height="43" rx="21" fill="#F1ECFC"/><text x="832.5" y="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#8A5BEF" text-anchor="middle">건선</text><rect x="965" y="410" width="245" height="43" rx="21" fill="#F1ECFC"/><text x="1087.5" y="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#8A5BEF" text-anchor="middle">아토피</text><rect x="710" y="469" width="245" height="43" rx="21" fill="#F1ECFC"/><text x="832.5" y="499" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#8A5BEF" text-anchor="middle">여드름</text><rect x="965" y="469" width="245" height="43" rx="21" fill="#F1ECFC"/><text x="1087.5" y="499" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#8A5BEF" text-anchor="middle">정상</text><rect x="710" y="528" width="245" height="43" rx="21" fill="#F1ECFC"/><text x="832.5" y="558" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#8A5BEF" text-anchor="middle">주사</text><line x1="710" y1="716" x2="1210" y2="716" stroke="#D9E3F0" stroke-width="2"/><text x="710" y="756" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#172D50" text-anchor="start">지루성 피부염은 주사와의 유사성 검토 후 제외</text><text x="710" y="790" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#172D50" text-anchor="start">정면·측면의 동일 대상 짝 관계가</text><text x="710" y="824" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#172D50" text-anchor="start">불확실하여 정면 사진만 사용</text><text x="710" y="937" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="400" fill="#657894" text-anchor="start">Skin·Hair 선정 이후 별도 구성</text><rect x="1290" y="274" width="560" height="680" rx="28" fill="white" stroke="#D9E3F0" stroke-width="2"/><rect x="1290" y="274" width="560" height="8" rx="4" fill="#10B5A5"/><text x="1320" y="331" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="30" font-weight="800" fill="#10B5A5" text-anchor="start">HAIR</text><text x="1320" y="377" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="29" font-weight="700" fill="#172D50" text-anchor="start">확대 두피 상태 5종</text><rect x="1320" y="410" width="245" height="43" rx="21" fill="#E5F7F4"/><text x="1442.5" y="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#10B5A5" text-anchor="middle">모낭사이홍반</text><rect x="1575" y="410" width="245" height="43" rx="21" fill="#E5F7F4"/><text x="1697.5" y="440" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#10B5A5" text-anchor="middle">미세각질</text><rect x="1320" y="469" width="245" height="43" rx="21" fill="#E5F7F4"/><text x="1442.5" y="499" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#10B5A5" text-anchor="middle">비듬</text><rect x="1575" y="469" width="245" height="43" rx="21" fill="#E5F7F4"/><text x="1697.5" y="499" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#10B5A5" text-anchor="middle">탈모</text><rect x="1320" y="528" width="245" height="43" rx="21" fill="#E5F7F4"/><text x="1442.5" y="558" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="24" font-weight="700" fill="#10B5A5" text-anchor="middle">피지과다</text><line x1="1320" y1="716" x2="1820" y2="716" stroke="#D9E3F0" stroke-width="2"/><text x="1320" y="756" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#172D50" text-anchor="start">원천 증상 중 중등도·중증을 중심으로 사용</text><text x="1320" y="790" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#172D50" text-anchor="start">초기에는 양호·경증을 제외</text><text x="1320" y="824" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="22" font-weight="400" fill="#172D50" text-anchor="start">모낭홍반/농포는 시각적 유사성 검토 후 제외</text><text x="1320" y="937" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="400" fill="#657894" text-anchor="start">양호를 추가한 6종은 별도 데이터 버전</text><text x="70" y="1016" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="19" font-weight="400" fill="#657894" text-anchor="start">Hair 원천은 다중 증상 라벨을 포함하며, 프로젝트에서는 선정한 5개 범주의 단일 분류 문제로 구성함.</text><text x="70" y="1050" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="18" font-weight="400" fill="#657894" text-anchor="start">출처: 모델별 class_names.json / 원천 데이터·클래스 선정표 / 초기 연구 기록</text><text x="1850" y="1050" font-family="'Noto Sans KR','Malgun Gothic',sans-serif" font-size="20" font-weight="700" fill="#657894" text-anchor="end">MediFlow</text></svg>